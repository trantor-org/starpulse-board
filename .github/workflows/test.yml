name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  plugin-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@2.1.309
      - run: claude plugin validate plugins/starpulse-board
      - run: claude plugin test plugins/starpulse-board
